[package]
name = "mdbook_gen_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
deunicode = "1.6.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
include_dir = "0.7.4"
pdfium-render = "0.9.4"
tempfile = "3.27.0"
thiserror = "2.0.21"

[features]
# Linka o PDFium estaticamente (requer PDFIUM_STATIC_LIB_PATH com libpdfium.a).
static = ["pdfium-render/static"]
